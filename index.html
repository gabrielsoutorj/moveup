<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>MoveUp — Monte seu perfil</title>
  <style>
    :root{--ink:#151515;--muted:#6b6b6b;--line:#e7e7e7;--soft:#f7f7f5;--accent:#65745a;--accent-dark:#4f5e46;--shadow:0 12px 34px rgba(0,0,0,.07)}
    *{box-sizing:border-box}
    body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh}
    .page{width:min(860px,100%);margin:0 auto;padding:38px 20px 52px}
    .brand{text-align:center;margin-bottom:28px}
    .brand h1{margin:0;font-size:clamp(40px,8vw,64px);letter-spacing:-.05em;line-height:.95}
    .brand p{margin:10px 0 0;color:var(--muted);font-size:15px}
    .card{border:1px solid var(--line);border-radius:24px;padding:24px;background:#fff;box-shadow:var(--shadow)}
    h2{font-size:23px;margin:0 0 5px;letter-spacing:-.025em}
    .lead{margin:0 0 22px;color:var(--muted);font-size:14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
    input{width:100%;height:50px;border:1px solid #d9d9d9;border-radius:13px;padding:0 14px;font:inherit;font-size:16px;outline:none;background:#fff}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,116,90,.12)}
    .unit{position:relative}.unit input{padding-right:48px}.unit span{position:absolute;right:14px;bottom:15px;color:#888;font-size:13px;pointer-events:none}
    .full{grid-column:1/-1}
    .sex-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .choice{height:50px;border:1px solid #d9d9d9;border-radius:13px;background:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.18s ease}
    .choice:hover{border-color:#b7b7b7}.choice.selected{border:2px solid var(--accent);background:#f4f6f2;color:var(--accent-dark)}
    .avatar-area{display:none;margin-top:25px;padding-top:24px;border-top:1px solid var(--line)}
    .avatar-area.show{display:block}
    .avatar-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
    .avatar-title h3{margin:0;font-size:18px}.avatar-title span{font-size:12px;color:var(--muted)}
    .avatars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .avatar{position:relative;border:1px solid var(--line);border-radius:18px;background:var(--soft);padding:8px;cursor:pointer;overflow:hidden;transition:.18s ease;min-width:0}
    .avatar:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.07)}
    .avatar.selected{border:3px solid var(--accent);padding:6px;background:#f1f5ee}
    .avatar img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center;border-radius:12px;background:#fff}
    .avatar .name{text-align:center;font-size:12px;font-weight:750;padding:8px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .check{display:none;position:absolute;top:13px;right:13px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:15px;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    .avatar.selected .check{display:flex}
    .actions{margin-top:24px}
    #start{width:100%;height:54px;border:0;border-radius:15px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:.18s ease}
    #start:hover:not(:disabled){background:var(--accent-dark);transform:translateY(-1px)}
    #start:disabled{background:#dededb;color:#9d9d98;cursor:not-allowed}
    .privacy{text-align:center;color:#999;font-size:11px;margin:11px 8px 0;line-height:1.4}
    .resume{display:none;margin-top:12px;text-align:center}.resume button{border:0;background:transparent;color:var(--accent-dark);font:inherit;font-size:13px;font-weight:750;cursor:pointer;text-decoration:underline}
    @media(max-width:640px){.page{padding:26px 15px 36px}.card{padding:19px;border-radius:21px}.grid{grid-template-columns:1fr;gap:13px}.full{grid-column:auto}.avatars{grid-template-columns:repeat(2,1fr);gap:10px}.brand{margin-bottom:21px}.brand p{font-size:14px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      <h1>MoveUp</h1>
      <p>Seu treino. Seu ritmo. Seu avatar.</p>
    </header>

    <section class="card">
      <h2>Monte seu perfil</h2>
      <p class="lead">Preencha seus dados e escolha quem vai acompanhar você nos treinos.</p>

      <form id="profileForm" autocomplete="on">
        <div class="grid">
          <div class="full">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" maxlength="50" placeholder="Como você quer ser chamado?" autocomplete="name" required />
          </div>

          <div>
            <label for="age">Idade</label>
            <input id="age" name="age" type="number" min="10" max="100" inputmode="numeric" placeholder="Ex.: 38" required />
          </div>

          <div>
            <label for="height">Altura</label>
            <div class="unit"><input id="height" name="height" type="number" min="100" max="230" inputmode="numeric" placeholder="Ex.: 187" required /><span>cm</span></div>
          </div>

          <div>
            <label for="weight">Peso</label>
            <div class="unit"><input id="weight" name="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal" placeholder="Ex.: 82" required /><span>kg</span></div>
          </div>

          <div>
            <label>Sexo</label>
            <div class="sex-row" role="group" aria-label="Sexo">
              <button class="choice" type="button" data-sex="Woman">Feminino</button>
              <button class="choice" type="button" data-sex="Man">Masculino</button>
            </div>
          </div>
        </div>

        <div id="avatarArea" class="avatar-area" aria-live="polite">
          <div class="avatar-title">
            <h3>Escolha seu avatar</h3>
            <span>Você poderá alterar depois</span>
          </div>
          <div id="avatars" class="avatars"></div>
        </div>

        <div class="actions">
          <button id="start" type="submit" disabled>Começar</button>
          <p class="privacy">Seus dados ficam salvos neste dispositivo para personalizar sua experiência.</p>
        </div>
      </form>

      <div id="resume" class="resume"><button type="button" id="resumeBtn">Continuar com o perfil salvo</button></div>
    </section>
  </main>

  <script>
    const PROFILE_KEY='moveup_profile_v1';
    const colors=[['Brown','Castanho'],['Blond','Loiro'],['Red','Ruivo'],['Black','Negro']];
    let selectedSex='';
    let selectedAvatar='';

    const form=document.getElementById('profileForm');
    const avatarArea=document.getElementById('avatarArea');
    const avatars=document.getElementById('avatars');
    const start=document.getElementById('start');
    const sexButtons=[...document.querySelectorAll('[data-sex]')];
    const fields=['name','age','height','weight'].map(id=>document.getElementById(id));

    const avatarFile=(sex,color)=>`avatar/Avatar_${sex}_${color}.jpg`;

    function renderAvatars(sex){
      selectedAvatar='';
      avatars.innerHTML='';
      colors.forEach(([color,label])=>{
        const b=document.createElement('button');
        b.type='button';
        b.className='avatar';
        b.dataset.avatar=color;
        b.innerHTML=`<span class="check">✓</span><img src="${avatarFile(sex,color)}" alt="Avatar ${label}" loading="eager"><div class="name">${label}</div>`;
        b.addEventListener('click',()=>{
          selectedAvatar=color;
          [...avatars.children].forEach(x=>x.classList.toggle('selected',x===b));
          validate();
        });
        avatars.appendChild(b);
      });
      avatarArea.classList.add('show');
      validate();
    }

    sexButtons.forEach(btn=>btn.addEventListener('click',()=>{
      selectedSex=btn.dataset.sex;
      sexButtons.forEach(x=>x.classList.toggle('selected',x===btn));
      renderAvatars(selectedSex);
    }));

    function validate(){
      const okFields=fields.every(f=>String(f.value).trim()!=='' && f.checkValidity());
      start.disabled=!(okFields && selectedSex && selectedAvatar);
    }
    fields.forEach(f=>f.addEventListener('input',validate));

    form.addEventListener('submit',e=>{
      e.preventDefault();
      validate();
      if(start.disabled)return;
      const profile={
        name:document.getElementById('name').value.trim(),
        age:Number(document.getElementById('age').value),
        heightCm:Number(document.getElementById('height').value),
        weightKg:Number(document.getElementById('weight').value),
        sex:selectedSex,
        avatar:selectedAvatar,
        avatarBase:avatarFile(selectedSex,selectedAvatar),
        createdAt:new Date().toISOString()
      };
      localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));
      location.href='workout.html';
    });

    const saved=localStorage.getItem(PROFILE_KEY);
    if(saved){
      try{
        const p=JSON.parse(saved);
        if(p && p.name && p.sex && p.avatar){
          document.getElementById('resume').style.display='block';
          document.getElementById('resumeBtn').textContent=`Continuar como ${p.name}`;
          document.getElementById('resumeBtn').onclick=()=>location.href='workout.html';
        }
      }catch(_){ }
    }
  </script>
</body>
</html>
