<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#4f5e46" />
  <title>MoveUp — Treino</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    iframe{display:block;width:100%;height:100dvh;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="workoutFrame" src="workout.html" title="Treino MoveUp" allow="screen-wake-lock"></iframe>
  <script>
    const PROFILE_KEY='moveup_profile_v1';
    const EXERCISE_IMAGE_NAMES={
      'Lymphatic Hops':'LymphaticHops',
      'Body Waves':'BodyWaves',
      'Trunk Twist':'TrunkTwist',
      'Arm Swings':'ArmSwings',
      'Jumping Jacks':'JumpingJacks',
      'Dead Arms':'DeadArms',
      'Golf Swing':'GolfSwing',
      'Marches':'Marches',
      'Ballet Squats':'BalletSquats',
      'Horseback Stance':'HorsebackStance',
      'Sit-Up':'SitUp',
      'Abdominal Plank':'Plank',
      'Push Ups':'PushUps',
      'Pull-Up / Chin-Up':'PullUp'
    };
    const EXERCISE_ORDER=Object.keys(EXERCISE_IMAGE_NAMES);

    function getSavedProfile(){
      try{return JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}catch(_){return {}}
    }

    function getAvatarExerciseImage(exerciseName){
      const profile=getSavedProfile();
      const stem=EXERCISE_IMAGE_NAMES[String(exerciseName||'').trim()];
      if(!stem || !profile.sex || !profile.avatar) return '';
      return `avatar/${stem}_${profile.sex}_${profile.avatar}.jpg`;
    }

    function applyAvatarImages(doc){
      const profile=getSavedProfile();
      if(!profile.sex || !profile.avatar) return;

      doc.querySelectorAll('.card').forEach(card=>{
        const title=card.querySelector('.card-title')?.textContent?.trim();
        const img=card.querySelector('img');
        const src=getAvatarExerciseImage(title);
        if(img && src && img.getAttribute('src')!==src){
          img.src=src;
          img.alt=`${title} — avatar selecionado`;
        }
      });

      const nameEl=doc.getElementById('exerciseName');
      const imageEl=doc.getElementById('exerciseImage');
      const currentName=nameEl?.textContent?.trim();
      const currentSrc=getAvatarExerciseImage(currentName);
      if(imageEl && currentSrc && imageEl.getAttribute('src')!==currentSrc){
        imageEl.src=currentSrc;
        imageEl.alt=`${currentName} — avatar selecionado`;
      }
    }

    function installNavigationLogic(doc){
      if(doc.getElementById('moveupNavigationLogic')) return;
      const script=doc.createElement('script');
      script.id='moveupNavigationLogic';
      script.textContent=`
        (function(){
          window.moveupJumpExercise=function(delta){
            try{
              if(!['countdown','exercise','rest','paused'].includes(phase)) return;
              const target=Math.max(0,Math.min(EXERCISES.length-1,current+(Number(delta)||0)));
              if(target===current) return;
              clearInterval(timerId);
              current=target;
              phase='exercise';
              inferPausedPhase='exercise';
              pausedRemaining=0;
              phaseDuration=WORK;
              deadline=performance.now()+WORK*1000;
              lastBeepSecond=WORK;
              $('pauseBtn').textContent='Ⅱ Pausar';
              requestWakeLock();
              renderWorkout(WORK);
              startTicker();
            }catch(e){console.error('MoveUp exercise navigation failed',e)}
          };
        })();
      `;
      doc.body.appendChild(script);
    }

    function updateNavButtons(doc){
      const currentName=doc.getElementById('exerciseName')?.textContent?.trim();
      const index=EXERCISE_ORDER.indexOf(currentName);
      const prev=doc.getElementById('prevExerciseBtn');
      const next=doc.getElementById('nextExerciseBtn');
      if(prev) prev.disabled=index<=0;
      if(next) next.disabled=index<0 || index>=EXERCISE_ORDER.length-1;
    }

    function enhanceWorkoutUI(doc){
      const visual=doc.querySelector('.visual-wrap');
      const desc=doc.getElementById('exerciseDesc');
      const detailArea=visual?.nextElementSibling;
      const timerArea=detailArea?.querySelector('.timer-area');

      if(desc && detailArea && timerArea && !doc.getElementById('moveupInstruction')){
        const instruction=doc.createElement('div');
        instruction.id='moveupInstruction';
        instruction.className='moveup-instruction';
        detailArea.insertBefore(instruction,timerArea);
        instruction.appendChild(desc);
      }

      const controls=doc.querySelector('.controls');
      const pause=doc.getElementById('pauseBtn');
      const restart=doc.getElementById('restartBtn');
      if(controls && pause && restart && !doc.getElementById('prevExerciseBtn')){
        const prev=doc.createElement('button');
        prev.id='prevExerciseBtn';
        prev.type='button';
        prev.className='control moveup-nav';
        prev.setAttribute('aria-label','Voltar ao exercício anterior');
        prev.title='Exercício anterior';
        prev.textContent='←';

        const next=doc.createElement('button');
        next.id='nextExerciseBtn';
        next.type='button';
        next.className='control moveup-nav';
        next.setAttribute('aria-label','Avançar para o próximo exercício');
        next.title='Próximo exercício';
        next.textContent='→';

        controls.insertBefore(prev,pause);
        controls.appendChild(next);
        prev.addEventListener('click',()=>frame.contentWindow.moveupJumpExercise?.(-1));
        next.addEventListener('click',()=>frame.contentWindow.moveupJumpExercise?.(1));
      }
      updateNavButtons(doc);
    }

    const frame=document.getElementById('workoutFrame');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc) return;

        if(!doc.getElementById('moveupGreenTheme')){
          const link=doc.createElement('link');
          link.id='moveupGreenTheme';
          link.rel='stylesheet';
          link.href='moveup-theme.css';
          doc.head.appendChild(link);
        }

        const meta=doc.querySelector('meta[name="theme-color"]');
        if(meta) meta.setAttribute('content','#4f5e46');

        installNavigationLogic(doc);
        enhanceWorkoutUI(doc);
        applyAvatarImages(doc);

        setTimeout(()=>{
          enhanceWorkoutUI(doc);
          applyAvatarImages(doc);
        },0);
        setTimeout(()=>{
          enhanceWorkoutUI(doc);
          applyAvatarImages(doc);
        },250);

        const nameEl=doc.getElementById('exerciseName');
        if(nameEl){
          new MutationObserver(()=>{
            applyAvatarImages(doc);
            updateNavButtons(doc);
          }).observe(nameEl,{childList:true,subtree:true,characterData:true});
        }

        const grid=doc.getElementById('exerciseGrid');
        if(grid){
          new MutationObserver(()=>applyAvatarImages(doc)).observe(grid,{childList:true,subtree:true});
        }
      }catch(e){
        console.error('MoveUp integration failed',e);
      }
    });
  </script>
</body>
</html>
